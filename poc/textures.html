<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textures</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.45 system-ui,
          sans-serif;
        background: #1e1d24;
        color: #e8e6ef;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 22rem 1fr;
        grid-template-rows: 100vh;
      }
      aside {
        padding: 1rem;
        overflow: auto;
        border-right: 1px solid #3d3b47;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
      }
      button,
      input,
      select {
        font: inherit;
        margin: 0.2rem 0.3rem 0.2rem 0;
        padding: 0.3rem 0.5rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
      }
      label {
        display: block;
        margin-top: 0.5rem;
      }
      #view {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .ok {
        color: #8fd18f;
      }
      .warn {
        color: #d9c27a;
      }
      .err {
        color: #e07a7a;
      }
      pre {
        background: #2b2a33;
        padding: 0.5rem;
        border-radius: 4px;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 40vh;
        overflow: auto;
      }
      dl {
        font-size: 13px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
      }
      dt {
        color: #a09db0;
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>Textures (V3 step 3, R17)</h1>
      <p id="status">Restoring saved folders...</p>
      <label
        >MO2 profile
        <select id="profile"></select
      ></label>
      <button id="kit" disabled>List the Imperial kit</button>
      <label
        >Model
        <select id="model"></select
      ></label>
      <button id="draw" disabled>Draw textured</button>
      <button id="measure" disabled>Load every texture of the kit</button>
      <p>
        Success criterion: a tile drawn with its textures; every texture of the kit loaded in a few
        seconds, within a written GPU memory budget.
      </p>
      <pre id="result">-</pre>
      <pre id="log"></pre>
    </aside>
    <div id="view"><canvas id="canvas"></canvas></div>
    <script type="module" src="./textures.ts"></script>
  </body>
</html>
