<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R14b - BSA + NIF + WebGL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.45 system-ui,
          sans-serif;
        background: #1e1d24;
        color: #e8e6ef;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 22rem 1fr;
        grid-template-rows: 100vh;
      }
      aside {
        padding: 1rem;
        overflow: auto;
        border-right: 1px solid #3d3b47;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
      }
      button,
      input,
      select {
        font: inherit;
        margin: 0.2rem 0.3rem 0.2rem 0;
        padding: 0.3rem 0.5rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
      }
      label {
        display: block;
        margin-top: 0.5rem;
      }
      #view {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .ok {
        color: #8fd18f;
      }
      .warn {
        color: #d9c27a;
      }
      .err {
        color: #e07a7a;
      }
      pre {
        background: #2b2a33;
        padding: 0.5rem;
        border-radius: 4px;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 40vh;
        overflow: auto;
      }
      dl {
        font-size: 13px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
      }
      dt {
        color: #a09db0;
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>R14b - tile from the archive</h1>
      <p id="status">Restoring saved folders...</p>
      <label
        >MO2 profile
        <select id="profile"></select
      ></label>
      <label
        >Mesh path (Data-relative)
        <input id="path" value="meshes/dungeons/imperial/smallhall/imphall1way01.nif" />
      </label>
      <select id="presets">
        <option value="meshes/dungeons/imperial/smallhall/imphall1way01.nif">
          smallhall 1way01
        </option>
        <option value="meshes/dungeons/imperial/smallhall/imphall1way128l01.nif">
          smallhall 1way128l01
        </option>
        <option value="meshes/dungeons/imperial/smallhall/imphall4way01.nif">
          smallhall 4way01
        </option>
        <option value="meshes/dungeons/imperial/smallhall/imphallstairs01.nif">
          smallhall stairs01
        </option>
        <option value="meshes/dungeons/imperial/largehall/implhall1way01.nif">
          largehall 1way01
        </option>
        <option value="meshes/dungeons/imperial/smallroom/improomdoor01.nif">
          smallroom door01
        </option>
        <option value="meshes/dungeons/imperial/largeroom/implroomdoor01.nif">
          largeroom door01
        </option>
      </select>
      <div>
        <button id="load" disabled>Load and draw</button>
        <button id="top">Top view</button>
        <label style="display: inline"
          ><input type="checkbox" id="alpha" style="width: auto" /> hide alpha shapes</label
        >
      </div>
      <dl id="stats"></dl>
      <pre id="log"></pre>
    </aside>
    <div id="view"><canvas id="canvas"></canvas></div>
    <script type="module" src="./r14b-bsa-nif.ts"></script>
  </body>
</html>
