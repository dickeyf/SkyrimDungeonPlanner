# The app as one self-contained HTML file: download it, open it in Chrome or Edge.
# Every push to main keeps it as a workflow artifact; a v* tag attaches it to a release.
name: Single-file build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:single
      - run: mv dist-single/index.html SkyrimDungeonPlanner.html
      - uses: actions/upload-artifact@v7
        with:
          name: SkyrimDungeonPlanner
          path: SkyrimDungeonPlanner.html
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SkyrimDungeonPlanner
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" SkyrimDungeonPlanner.html
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
